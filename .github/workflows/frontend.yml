name: Frontend

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Python
        run: uv python install

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API types and check for drift
        run: |
          pnpm generate:api
          if ! git diff --quiet -- types/generated/api.ts; then
            echo "::error::frontend/types/generated/api.ts is stale. Run 'pnpm generate:api' in frontend/ and commit the result." >&2
            git diff -- types/generated/api.ts
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

[package]
name = "onestep-desktop"
version = "0.1.0"
description = "Onestep AI Platform desktop shell"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "onestep_desktop"
path = "src/lib.rs"

[[bin]]
name = "onestep-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
ureq = { version = "2.10", features = ["tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

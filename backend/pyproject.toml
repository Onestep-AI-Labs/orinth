[project]
name = "orinth-backend"
version = "0.1.0"
description = "FastAPI backend for Orinth image datasets, inference, testing, and training jobs."
# torch 2.2.2 — the last release with a macOS x86_64 wheel — has no cp312
# build, and the lock has to resolve for every supported interpreter.
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "pillow>=10.4.0",
    "numpy>=1.26.4",
    # Phase 21: reading Parquet during dataset detection. Most Hugging Face
    # datasets ship no other format, so the prep agent needs it to see them at
    # all. Present transitively before this; declared because it is now used
    # directly.
    "polars>=1.0.0",
    "opencv-python>=4.10.0.84",
    "scikit-learn>=1.5.1",
    "pycocotools>=2.0.8",
    "ultralytics>=8.3.0",
    # Intel Macs are capped by upstream: TensorFlow's last macOS x86_64 wheel
    # is 2.16.2 and PyTorch's is 2.2.2. Both libraries dropped Intel-Mac builds
    # in 2024; the markers below keep those machines installable without
    # holding every other platform back.
    "tensorflow==2.16.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Floor sits above the Intel pin on purpose: uv collapses to a single
    # version whenever one satisfies every branch, which would drag Apple
    # silicon and Linux back to 2.16.2 just to accommodate Intel Macs.
    "tensorflow>=2.18; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.2.0,<=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.3.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Gemma 4 support landed in transformers 5.5.0; the shared BERT/BART
    # runners ride the same dependency, so their tests gate this upgrade.
    "transformers>=5.5.0",
    "albumentations>=1.4.24,<2.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    # Phase 15 chat proxy: async streaming client between the API and the
    # managed llama.cpp server.
    "httpx>=0.27.0",
]

# The `orinth` CLI (phase 23). `[tool.hatch.build.targets.wheel]` already
# packages `app`, so `app/cli/` ships with no build-config change.
[project.scripts]
orinth = "app.cli.main:main"

[project.optional-dependencies]
# LLM fine-tuning (phase 14). Installable on every platform, including macOS —
# the CUDA-only packages are deliberately split into `llm-cuda` below so a Mac
# can install this group at all.
llm = [
    "peft>=0.14.0",
    "trl>=0.19.0",
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
    "sentencepiece>=0.2.0",
    "gguf>=0.10.0",
    # The `[server]` extra pulls the deps `python -m llama_cpp.server` needs at
    # import (sse-starlette, starlette-context, pyyaml) on top of the base
    # bindings — without it serving crashes with ModuleNotFoundError: sse_starlette.
    "llama-cpp-python[server]>=0.3.0",
    # Web search for the chat "Search" mode (DuckDuckGo, no API key).
    "ddgs>=6.0",
]
# Only reliably installable on CUDA platforms.
llm-cuda = [
    "unsloth>=2025.12.1; sys_platform == 'linux'",
    "bitsandbytes>=0.45.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.7",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: heavy ML training tests excluded from the default fast run (run with `uv run pytest -m slow` or without `-m` to include them).",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:__array__ implementation doesn't accept a copy keyword, so passing copy=False failed.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
ignore = [
    "E501", # line length: many long lines predate this gate; a dedicated formatting pass is out of scope here
    "B008", # FastAPI's `Depends()`/`File()` default-argument pattern is idiomatic, not a bug
]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# Pragmatic baseline: start non-strict and tighten incrementally rather than
# requiring a full-strict pass across the ML-heavy service layer up front.
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff.lint.per-file-ignores]
# app/core/database.py is out of scope for this spec's edits (owned elsewhere);
# ignore the violations a full fix/reformat would otherwise touch there.
"app/core/database.py" = ["DTZ003", "I001"]
# Test-file cleanup is out of scope for this spec beyond the new `slow` markers.
"tests/*" = ["I001", "DTZ003"]
